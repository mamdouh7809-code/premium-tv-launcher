name: Build and verify NOIR TV
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: 'false'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android build SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Generate and persist the official Gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.11.1 --distribution-type bin --gradle-distribution-sha256-sum f397b287023acdba1e9f6fc5ea72d22dd63669d59ed4a289a29b1a76eee151c6
          chmod +x gradlew scripts/bootstrap-wrapper.sh
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
            if ! git diff --cached --quiet; then
              git commit -m "Include verified official Gradle wrapper"
              git push origin HEAD:main
            fi
          fi
      - name: Lint, unit tests, optimized APK and instrumentation APK
        run: ./gradlew --no-daemon :app:lintDebug :app:testDebugUnitTest :app:assembleDebug :app:assemblePreview :app:assembleDebugAndroidTest :fixture:assembleDebug
      - name: Verify APK signature and manifest
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/preview/app-preview.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/preview/app-preview.apk
      - name: Package complete deliverables
        run: python3 scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: Premium-TV-Launcher-Deliverables
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: Emulator-test-APKs
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
            fixture/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Build-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
  device-tests:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: 'false'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/download-artifact@v4
        with:
          name: Emulator-test-APKs
          path: test-apks
      - name: Real framework and D-pad tests on Android 10
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -memory 1536
          script: |
            adb shell wm size 1920x1080
            adb shell wm density 240
            adb push test-apks/fixture/build/outputs/apk/debug/fixture-debug.apk /data/local/tmp/noir-fixture.apk
            adb install -r test-apks/app/build/outputs/apk/debug/app-debug.apk
            adb install -r test-apks/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -r com.premiumtv.launcher.test/androidx.test.runner.AndroidJUnitRunner | tee instrumentation.txt
            python3 -c "from pathlib import Path; t=Path('instrumentation.txt').read_text(); assert 'OK (4 tests)' in t and 'FAILURES!!!' not in t, t"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-10-device-test-result
          path: instrumentation.txt
          if-no-files-found: ignore
  publish:
    needs: [build, device-tests]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Premium-TV-Launcher-Deliverables
          path: dist
      - name: Publish installable APK and complete ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          NOIR_RELEASE_TAG: build-${{ github.run_number }}
        run: |
          gh release create "$NOIR_RELEASE_TAG" dist/* --title "NOIR TV 1.0.0 · Build ${{ github.run_number }}" --notes-file docs/RELEASE-NOTES.md --prerelease
